# KITTI raw（synced）：有 oxts，因此是 LIO 场景。
# body = IMU，激光外参来自 calib_imu_to_velo.txt；缺这个文件时用 calibration.file 补上。
# 真值由 oxts 解到"第一帧选中扫描时刻的 body"，只覆盖选中的扫描窗口。
#
# 注意 `_sync` 目录里的 oxts 是按同步帧取的约 10 Hz 导航状态，不是 100 Hz 惯性流。
# 读取器按实测频率给出推荐策略；做预积分的 LIO 应在 packetizer 里按自己的需要收紧
# max_imu_gap_s（那时低频导航流会被如实标缺口）。
#
#   simpleslam-lio-skeleton configs/new_stack/kitti_raw.yaml \
#       dataset.path=/data/kitti/raw/2011_09_26/2011_09_26_drive_0027_sync
name: kitti-raw-0027

dataset:
  kind: kitti_raw
  path: /data/kitti/raw/2011_09_26/2011_09_26_drive_0027_sync
  max_scans: 0

runtime:
  offline: true
  worker_threads: 1

odometry:
  algorithm: my_lio
  keyframe_distance_m: 1.5
  keyframe_rotation_deg: 15.0

evaluation:
  output: /tmp/kitti_raw_estimate.tum
  format: tum
  alignment: se3
  # 估计在扫描终点，真值在 oxts 原始时刻，两边不同步：把真值插值到估计时刻，
  # 而不是放宽最近邻容差（那是拿相邻时刻的位置冒充同一时刻）
  association: interpolate
  max_interpolation_gap_s: 0.15
