# 任务：离线跑 KITTI odometry 的一段序列并对真值评测。
#
#   simpleslam-lio-skeleton configs/tasks/kitti_odometry.yaml \
#       data.source.path=/data/kitti/odometry/sequences/00
#
# 换算法改 system，换数据改 data.source，只跑不评测就去掉 evaluation.evaluators。
task:
  name: kitti-00
  mode: offline
system: ../systems/my_lio.yaml
data:
  source:
    type: kitti_odometry
    path: /data/kitti/odometry/sequences/00
    groundtruth_frame: body
evaluation:
  evaluators:
    ate: {type: ate, alignment: se3}
    rpe: {type: rpe, delta_m: 100}
